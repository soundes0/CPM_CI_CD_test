<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CPM</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="{{ url_for('static', filename='main.css') }}">
</head>
<body>
    <h1>Critical Path Method</h1>
    <p class="subtitle">Plan your project. Calculate your critical path.</p>

    {% with messages = get_flashed_messages() %}
        {% if messages %}
        <div class="flash-messages" role="alert">
            {% for message in messages %}<p>{{ message }}</p>{% endfor %}
        </div>
        {% endif %}
    {% endwith %}

    <div class="card">
        <form method="post">
           <label for="project_name">Project name</label>
                <input type="text" id="project_name" name="project_name"
                    placeholder="Enter your project name"
                    maxlength="100" required>

            <label for="activities">Number of activities</label>
                <input type="number" id="activities" name="activities"placeholder="Enter the number of the activities"
                    min="1" required>

            <label class="check">
                <input class="form-check-input" type="checkbox" name="graph" >
                show precedence graph
            </label>

            <label class="check">
                <input class="form-check-input" type="checkbox" name="information">
                show additional information (ES, EF, LS, LF...)
            </label>

            <button id="submit" type="submit" aria-label="Next">→</button>
        </form>
    </div>
</body>
</html>
